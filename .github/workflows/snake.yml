name: Generate Contribution Snake

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=FF4500&color_dots[0]=161B22&color_dots[1]=4D2800&color_dots[2]=994400&color_dots[3]=FF8C00&color_dots[4]=FFD700
            dist/github-contribution-grid-snake-dark.svg?color_snake=FF4500&color_dots[0]=161B22&color_dots[1]=4D2800&color_dots[2]=994400&color_dots[3]=FF8C00&color_dots[4]=FFD700

      - name: Push Snake to Output Branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
